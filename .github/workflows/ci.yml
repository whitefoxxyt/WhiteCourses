name: CI - Tests & SonarCloud Analysis

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-and-analyze:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: appcourse
          MYSQL_USER: appuser
          MYSQL_PASSWORD: apppassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build project (exclude iOS targets)
        run: ./gradlew build -x test -x :composeApp:compileTestKotlinIosArm64 -x :composeApp:compileTestKotlinIosSimulatorArm64 -x :shared:compileTestKotlinIosArm64 -x :shared:compileTestKotlinIosSimulatorArm64 --no-daemon

      - name: Run tests
        run: ./gradlew :server:test --no-daemon
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: appcourse
          DB_USER: appuser
          DB_PASSWORD: apppassword

      - name: Generate JaCoCo coverage report
        run: ./gradlew :server:jacocoTestReport --no-daemon

      - name: Verify coverage threshold
        run: ./gradlew :server:jacocoTestCoverageVerification --no-daemon
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            server/build/reports/tests/test/
            server/build/reports/jacoco/

      - name: Upload coverage to Codecov (optional)
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: ./server/build/reports/jacoco/test/jacocoTestReport.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true
