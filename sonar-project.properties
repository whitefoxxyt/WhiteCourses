# SonarQube Configuration
sonar.projectKey=appcourse
sonar.projectName=AppCourse
sonar.projectVersion=1.0.0

# Server configuration
sonar.host.url=http://localhost:9000

# Sources
sonar.sources=server/src/main/kotlin,composeApp/src/commonMain/kotlin,shared/src/commonMain/kotlin
sonar.tests=server/src/test/kotlin,composeApp/src/commonTest/kotlin

# Language
sonar.language=kotlin

# Java version
sonar.java.source=17
sonar.java.target=17

# Code coverage
sonar.coverage.jacoco.xmlReportPaths=server/build/reports/jacoco/test/jacocoTestReport.xml

# Exclusions
sonar.exclusions=**/build/**,**/generated/**,**/*.kts,**/androidMain/**,**/iosMain/**
sonar.coverage.exclusions=**/test/**,**/androidTest/**,**/build/**,**/generated/**

# Quality gates
sonar.qualitygate.wait=true
