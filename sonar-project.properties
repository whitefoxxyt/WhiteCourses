# SonarQube Configuration
sonar.projectKey=appcourse
sonar.projectName=AppCourse
sonar.projectVersion=2.0

# Server configuration (override with SONAR_HOST_URL environment variable in CI)
sonar.host.url=http://localhost:9000

# Sources
sonar.sources=server/src/main/kotlin,shared/src/commonMain/kotlin
sonar.tests=server/src/test/kotlin

# Java binaries
sonar.java.binaries=server/build/classes

# Language
sonar.language=kotlin

# Java version
sonar.java.source=17
sonar.java.target=17

# Code coverage
sonar.coverage.jacoco.xmlReportPaths=server/build/reports/jacoco/test/jacocoTestReport.xml

# Exclusions
sonar.exclusions=**/build/**,**/generated/**,**/*.kts,**/resources/**,**/test/**
sonar.test.exclusions=**/test/**
sonar.coverage.exclusions=**/test/**,**/build/**,**/generated/**

# Quality gates
sonar.qualitygate.wait=true

# SCM
sonar.scm.provider=git
